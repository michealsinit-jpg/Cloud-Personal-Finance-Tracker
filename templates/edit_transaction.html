<!DOCTYPE html>

<html>

<head>

    <title>Edit Transaction</title>

    <link rel="stylesheet"

          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Edit Transaction</h1>

<form method="POST">

    <label>Type</label><br>

    <input type="text"

           name="transaction_type"

           value="{{ transaction.transaction_type }}"><br><br>

    <label>Category</label><br>

    <input type="text"

           name="category"

           value="{{ transaction.category }}"><br><br>

    <label>Description</label><br>

    <input type="text"

           name="description"

           value="{{ transaction.description }}"><br><br>

    <label>Amount</label><br>

    <input type="number"

           step="0.01"

           name="amount"

           value="{{ transaction.amount }}"><br><br>

    <label>Date</label><br>

    <input type="date"

           name="date"

           value="{{ transaction.transaction_date }}"><br><br>

    <button type="submit">Save Changes</button>

</form>

</div>

</body>

</html>
