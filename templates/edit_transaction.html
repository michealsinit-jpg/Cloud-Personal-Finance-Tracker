<!DOCTYPE html>

<html>

<head>

    <title>Edit Transaction</title>

    <link rel="stylesheet"

          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="form-container">

    <div class="form-card">

        <h1>✏️ Edit Transaction</h1>

        <p>Update the details of your transaction.</p>

        <form method="POST">

            <div class="form-group">

                <label>Transaction Type</label>

                <select name="transaction_type">

                    <option value="income"

                    {% if transaction.transaction_type|lower == "income" %}selected{% endif %}>

                        Income

                    </option>

                    <option value="expense"

                    {% if transaction.transaction_type|lower == "expense" %}selected{% endif %}>

                        Expense

                    </option>

                </select>

            </div>

            <div class="form-group">

                <label>Category</label>

                <input

                    type="text"

                    name="category"

                    value="{{ transaction.category }}"

                    placeholder="Enter category"

                    required>

            </div>

            <div class="form-group">

                <label>Description</label>

                <input

                    type="text"

                    name="description"

                    value="{{ transaction.description }}"

                    placeholder="Enter description"

                    required>

            </div>

            <div class="form-group">

                <label>Amount</label>

                <input

                    type="number"

                    step="0.01"

                    name="amount"

                    value="{{ transaction.amount }}"

                    placeholder="0.00"

                    required>

            </div>

            <div class="form-group">

                <label>Date</label>

                <input

                    type="date"

                    name="date"

                    value="{{ transaction.transaction_date }}"

                    required>

            </div>

            <button type="submit" class="btn">

                💾 Save Changes

            </button>

        </form>

        <p style="text-align:center; margin-top:20px;">

            <a href="{{ url_for('transactions') }}" class="back-btn">

                ← Back to Transactions

            </a>

        </p>

    </div>

</div>

</body>

</html>
